name: CI

# The same gate as a local run (scripts/gate.sh on macOS, scripts/test_ubuntu.sh on Linux), on Linux and macOS.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64 GCC
            os: ubuntu-24.04
            cxx: g++
          - name: Linux x86-64 Clang
            os: ubuntu-24.04
            cxx: clang++
          - name: macOS ARM64 Apple Clang
            os: macos-latest
            cxx: c++
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: |
            3.13
            3.12

      - name: Build tools
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build doxygen; fi
          if [ "$RUNNER_OS" = macOS ]; then brew install ninja doxygen; fi

      - name: Static checks
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          python3 scripts/check_version.py
          python3 scripts/check_mirror.py
          python3 third_party/tooling/scripts/check_interfaces.py
          python3 third_party/tooling/scripts/single_include.py --check

      - name: Wheelhouse (the one networked step)
        run: scripts/fetch_wheels.sh python3.12 python3.13

      - name: Gate
        run: scripts/gate.sh --cxx ${{ matrix.cxx }}

  # The documentation is published to GitHub Pages: main to /main/, each release tag to its own /vX.Y.Z/, and the
  # site's root to the newest release.
  docs:
    name: Documentation (warnings are errors)
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # to publish to the gh-pages branch
    concurrency:
      group: pages           # main and a tag pushed together must not race on gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends doxygen

      - name: Configure
        run: >
          cmake -B build -DCORE_ADAPTERS_BUILD_TESTS=OFF -DCORE_ADAPTERS_BUILD_PYTHON=OFF
          -DCORE_ADAPTERS_WITH_NANOBIND=OFF -DCORE_ADAPTERS_WITH_NLOHMANN=OFF -DCORE_ADAPTERS_BUILD_DOCS=ON

      - name: Build the documentation
        run: cmake --build build --target docs

      # gh-pages holds generated HTML only, one folder per version; never edit it by hand.
      - name: Publish to GitHub Pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          DEST: ${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/site"
          trap 'git worktree remove --force "$site" 2>/dev/null || true' EXIT
          git branch -D gh-pages 2>/dev/null || true
          if git fetch --depth 1 origin gh-pages 2>/dev/null; then
            git worktree add "$site" FETCH_HEAD
            git -C "$site" switch -C gh-pages
          else
            git worktree add --detach "$site"
            git -C "$site" switch --orphan gh-pages
          fi
          rm -rf "${site:?}/$DEST" && mkdir -p "$site/$DEST" && cp -R build/docs/html/. "$site/$DEST/"
          touch "$site/.nojekyll"
          latest=$(cd "$site" && ls -d v*/ 2>/dev/null | tr -d / | sort -V | tail -1 || true)
          target=${latest:-main}
          printf '<!DOCTYPE html>\n<meta charset="utf-8">\n<title>core-adapters</title>\n<meta http-equiv="refresh" content="0; url=%s/">\n<p>The documentation for <a href="%s/">core-adapters %s</a>; every version: %s</p>\n' \
            "$target" "$target" "$target" "$(cd "$site" && ls -d main v*/ 2>/dev/null | tr -d / | sort -V | sed 's|.*|<a href="&/">&</a>|' | paste -sd ' ' -)" > "$site/index.html"
          git -C "$site" add -A
          if git -C "$site" diff --cached --quiet; then echo "nothing to publish"; exit 0; fi
          git -C "$site" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "docs: $DEST ($GITHUB_SHA)"
          git -C "$site" push origin gh-pages

  # The single include is never committed, so it cannot be stale: on a release tag it is generated from the tagged
  # commit, compiled alone with warnings as errors, and attached to the GitHub release, once the gating legs are green
  single-include:
    name: Release the single include
    needs: [gate, docs]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false

      - name: Generate it from the tagged commit
        run: |
          set -euo pipefail
          python3 third_party/tooling/scripts/single_include.py --check
          python3 third_party/tooling/scripts/single_include.py --out "$RUNNER_TEMP/single_include"
          ls -l "$RUNNER_TEMP/single_include"

      - name: It compiles alone, warnings as errors
        run: |
          printf '#include "snicholls_core_adapters.hpp"\n' > "$RUNNER_TEMP/use.cpp"
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -fsyntax-only -I"$RUNNER_TEMP/single_include" "$RUNNER_TEMP/use.cpp"

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --verify-tag --title "core-adapters $TAG" --notes "See CHANGELOG.md for $TAG."
          gh release upload "$TAG" "$RUNNER_TEMP/single_include/snicholls_core_adapters.hpp" --clobber
