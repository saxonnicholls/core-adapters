#
#  tooling.conf
#  core-adapters
#
#  Copyright 2010-2026 Saxon Herschel Nicholls
#
#  The settings tooling's scripts read (third_party/tooling, README "tooling.conf"). core-adapters runs its own
#  check_mirror and check_version; it takes tooling's single include and interface check. Every adapter links a third
#  party, so the single include (generated, never committed) holds the version header and the core it uses; the
#  adapters are opted out, each with its reason.

name          = core-adapters
include_root  = include/snicholls/core_adapters
namespace     = snicholls
umbrella      = core_adapters.hpp

single_include.snicholls_core_adapters = snicholls/core_adapters/core_adapters.hpp   # the standard-library-only part
single_include_inline = include third_party/core/include
single_include_opt_in = nanobind/bytes.hpp nanobind/errors.hpp nanobind/gil.hpp nanobind/ndarray.hpp nanobind/optional.hpp nlohmann/decimal_json.hpp nlohmann/json.hpp nlohmann/secret_json.hpp nlohmann/time_json.hpp nlohmann/uuid_json.hpp   # nanobind/: nanobind and Python.h (snicholls::core_nanobind); nlohmann/: nlohmann/json (snicholls::core_json)
